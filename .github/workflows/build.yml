name: Build

# Owner's rule: CI runs with a public release and only then. Pushing a version tag (`vX.Y.Z`, or a release candidate
# `vX.Y.Z-rc.N`) starts this workflow. The tagged commit must not contain `[skip ci]`. There is no manual start, and
# nothing runs on an ordinary push or a pull request. Do not add other triggers without the owner's decision.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

# Least privilege: the job only reads the repository.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned by its full commit SHA, with the version in a comment.

jobs:
  build:
    name: Tests and builds
    # The Xcode 27 image (macOS 27, Apple silicon): https://github.blog/changelog/2026-10-15-xcode-27-runner-image-generally-available
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Actions are pinned by commit SHA
        run: |
          if grep -nE '^\s*(-\s*)?uses:\s*[^#[:space:]]+@' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}(\s|$)'; then
            echo "Pin every action by its full commit SHA and name the version in a comment."
            exit 1
          fi

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -downloadComponent MetalToolchain

      - name: Package tests, app builds, repository checks
        run: sh tools/test.sh
