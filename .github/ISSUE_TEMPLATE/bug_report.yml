name: Bug report
description: Something in DELOS for Apple does not work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system version
      placeholder: iPhone 14 Pro Max, iOS 18.4
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: DELOS commit or version
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host software and version
      placeholder: Vibepollo 1.2.3
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Remove IP addresses, PC and account names first.
